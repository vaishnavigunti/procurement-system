spring.application.name=procurement-system

# --- Database (PostgreSQL 17 runs on port 5433 on this laptop) ---
spring.datasource.url=jdbc:postgresql://localhost:5433/procurement_db
spring.datasource.username=${DB_USERNAME:procurement_user}
spring.datasource.password=${DB_PASSWORD:ChangeMe123!}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# --- Actuator (health check) ---
management.endpoints.web.exposure.include=health,info